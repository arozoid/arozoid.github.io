<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111318">
    <title>arozoid@web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="terminal">
        <div id="output" aria-live="polite"></div>

        <form id="input-form" autocomplete="off">
            <label class="prompt" for="command">
                <span class="user">arozoid@web</span>:<span class="cwd">~</span>$
            </label>
            <input
                id="command"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                autofocus
                aria-label="terminal input"
            >
        </form>
    </main>

    <script src="main.js"></script>
</body>
</html>
